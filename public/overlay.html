<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설교 리모컨 · 유튜브 자막</title>
<!-- OBS "브라우저" 소스로 겹치는 자막 화면 (너비 1920, 높이 1080, 배경 투명). ?preview=1 이면 어두운 배경에 예시 글자
     하단 자막(lower): 방송 영상 위에 글자만 / 풀스크린(full): 배경 그림·영상으로 화면 전체를 덮고 그 위에 글자 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face { font-family: "Pretendard Local"; src: url("/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
body { position: relative; }   /* 창 크기와 상관없이 1920×1080 기준 */
body { font-family: "Pretendard Local", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif; color: #fff; }
body.preview { background: radial-gradient(ellipse at 30% 20%, #4a5560 0%, #1d2228 55%, #0d0f12 100%); }
/* 화면 전체(자막 + 풀스크린 배경)를 함께 페이드 */
#stage { position: absolute; inset: 0; opacity: 0; transition: opacity .3s ease; }
#stage.on { opacity: 1; }
#stage.quick { transition-duration: .15s; }
#bg { position: absolute; inset: 0; background: #000; display: none; overflow: hidden; }
#stage.full #bg { display: block; }
#bg img, #bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
#bg img.on, #bg video.on { display: block; }
#dim { position: absolute; inset: 0; background: #000; opacity: var(--dim, .3); }
#wrap { position: absolute; left: 0; right: 0; display: flex; justify-content: center; padding: 0 140px; box-sizing: border-box; }
#wrap.bottom { bottom: var(--m, 80px); } #wrap.top { top: var(--m, 80px); }
#wrap.full { top: 0; bottom: 0; align-items: center; padding: 0 var(--m, 160px); }
#wrap.left { justify-content: flex-start; }
#box { max-width: 100%; max-height: var(--maxh, 454px); overflow: hidden; transition: opacity .15s ease; font-size: var(--fs, 56px); line-height: 1.42; font-weight: 650;
  letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; box-sizing: border-box;
  text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.9); }
#box.hide { opacity: 0; }
#wrap.center #box { text-align: center; } #wrap.left #box { text-align: left; }
#box.band { background: rgba(0,0,0,var(--ba, .55)); padding: .45em .9em; border-radius: 18px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
#ref { display: block; font-size: .62em; font-weight: 600; margin-bottom: .2em; opacity: .95; }
#ref:empty { display: none; }
#body { white-space: pre-line; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><img id="bgImg" alt=""><video id="bgVid" muted loop playsinline preload="auto"></video><div id="dim"></div></div>
  <div id="wrap" class="bottom center"><div id="box"><span id="ref"></span><div id="body"></div></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search), PREVIEW = q.get('preview') === '1';
const KEYQ = q.get('key') ? '?key=' + encodeURIComponent(q.get('key')) : '';
const REV = '__OV_REV__';            // 서버가 넣어 주는 이 화면의 판 번호
// 미리보기 예시: 일반 자막 / 성경 구절
const SAMPLES = { text: { show: true, kind: 'text', first: '', body: '사랑은 받은 만큼 흘러갑니다' },
  verse: { show: true, kind: 'verse', first: '요 3:16', body: '하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라' } };
let design = {}, state = { show: false }, shown = null, scene = null, gen = 0, sample = q.get('sample') === 'text' ? 'text' : 'verse';
if (PREVIEW) document.body.classList.add('preview');

// 일반 자막과 성경 구절은 디자인을 따로 씁니다 (design.text / design.verse)
const kindOf = s => s.kind === 'verse' || s.kind === 'text' ? s.kind : (s.first ? 'verse' : 'text');
const dOf = s => design[kindOf(s)] || design;
const isFull = d => d.mode === 'full';
const sceneOf = s => { const d = dOf(s); return isFull(d) ? 'full:' + (d.bg || '') : 'lower'; };   // 장면이 같으면 글자만 바꿈
const isVideo = n => /\.(mp4|m4v|mov|webm)$/i.test(n || '');
function setBg(d) {                  // 풀스크린 배경 그림·영상 (같은 파일이면 그대로 두어 영상이 처음부터 다시 시작하지 않게)
  const img = $('bgImg'), vid = $('bgVid'), n = isFull(d) ? d.bg || '' : '';
  const url = n ? '/overlay-media/' + encodeURIComponent(n) + KEYQ : '';
  $('dim').style.setProperty('--dim', n ? (d.bgDim ?? 30) / 100 : 0);
  if (isVideo(n)) {
    img.classList.remove('on'); img.removeAttribute('src'); img.dataset.n = '';
    if (vid.dataset.n !== n) { vid.dataset.n = n; vid.src = url; }
    vid.classList.add('on'); vid.play().catch(() => {});
  } else {
    if (vid.dataset.n) { vid.pause(); vid.removeAttribute('src'); vid.load(); vid.dataset.n = ''; }
    vid.classList.remove('on');
    if (n) { if (img.dataset.n !== n) { img.dataset.n = n; img.src = url; } img.classList.add('on'); }
    else { img.classList.remove('on'); img.dataset.n = ''; img.removeAttribute('src'); }
  }
}
function applyDesign(d) {
  const w = $('wrap'), b = $('box'), full = isFull(d);
  $('stage').classList.toggle('full', full);
  w.className = (full ? 'full' : d.pos === 'top' ? 'top' : 'bottom') + ' ' + (d.align === 'left' ? 'left' : 'center');
  w.style.setProperty('--m', (full ? Math.max(80, d.margin ?? 160) : d.margin ?? 80) + 'px');
  b.style.setProperty('--maxh', (full ? 1080 - 120 : 454) + 'px');
  b.classList.toggle('band', d.band === 'half');
  b.style.setProperty('--ba', (d.bandAlpha ?? 55) / 100);
  setBg(d);
}
function fit(d) {                    // 넘치면 글자 크기를 조금씩 줄임 (원래 크기의 절반까지, 그래도 넘치면 잘라서 화면을 덮지 않게)
  const b = $('box'), base = d.size || 56, maxh = isFull(d) ? 1080 - 120 : 454;
  let fs = base; b.style.setProperty('--fs', fs + 'px');
  while (b.scrollHeight > maxh && fs > base * 0.5) { fs -= 2; b.style.setProperty('--fs', fs + 'px'); }
}
function fill(s) {
  const d = dOf(s);
  applyDesign(d);
  $('ref').textContent = s.first || '';
  $('ref').style.color = d.refColor === 'style' ? (s.color || '#ffffff') : (d.refColor || '#ffd76a');
  $('body').textContent = s.body || ''; fit(d);
}
function render() {
  let s = state;
  if (PREVIEW && !s.show) s = SAMPLES[sample];
  else if (!PREVIEW && !design.on) s = { show: false };
  const key = s.show ? JSON.stringify([kindOf(s), s.first, s.body, s.color]) : null, st = $('stage'), b = $('box'), my = ++gen;
  if (!s.show) {                     // 사라지는 동안은 모양을 그대로, 다 사라지면 영상을 멈춤
    st.classList.remove('quick'); st.classList.remove('on'); shown = null; scene = null;
    setTimeout(() => { if (my === gen) $('bgVid').pause(); }, 400);
    return;
  }
  const sc = sceneOf(s);
  if (shown === null) { fill(s); b.classList.remove('hide'); st.classList.remove('quick'); void st.offsetWidth; st.classList.add('on'); }   // 한 번 그린 뒤 페이드인
  else if (key !== shown && sc === scene) {   // 같은 장면(같은 배경): 글자만 살짝 사라졌다가 새 글자로
    b.classList.add('hide');
    setTimeout(() => { if (my !== gen) return; fill(s); b.classList.remove('hide'); }, 160);
  } else if (key !== shown) {        // 장면이 바뀜(하단 ↔ 풀스크린, 다른 배경): 화면 전체가 살짝 사라졌다가 새 모양으로
    st.classList.add('quick'); st.classList.remove('on');
    setTimeout(() => { if (my !== gen) return; fill(s); b.classList.remove('hide'); st.classList.add('on'); setTimeout(() => st.classList.remove('quick'), 200); }, 160);
  } else fill(s);                    // 같은 글자: 디자인만 다시 맞춤
  shown = key; scene = sc;
}

// 서버와 연결 (꺼졌다 켜져도 저절로 다시 연결)
let es, lastMsg = Date.now();
function connect() {
  try { es && es.close(); } catch {}
  es = new EventSource('/api/overlay/events' + KEYQ);
  es.onmessage = e => {
    lastMsg = Date.now();
    let j; try { j = JSON.parse(e.data); } catch { return; }
    if (j.rev && REV.length === 12 && j.rev !== REV) return location.reload();   // 설교 리모컨이 업데이트됨 → 새 화면으로
    design = j.design || {}; state = j.state || { show: false }; render();
  };
  es.addEventListener('ping', () => { lastMsg = Date.now(); });   // 15초마다 오는 keep-alive
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000); };
}
setInterval(() => { if (Date.now() - lastMsg > 40000) { lastMsg = Date.now(); connect(); } }, 5000);   // keep-alive가 40초 넘게 없으면 다시 연결
// 준비 화면의 미리보기는 저장 전 디자인을 바로 보내 줍니다
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data?.design) return;
  design = e.data.design; if (e.data.sample) sample = e.data.sample; render();
});
document.fonts?.ready.then(() => shown !== null && render());
connect();
</script>
</body>
</html>
